<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商后台演示 - 前端</title>
    <!-- 引入 Tailwind CSS 进行快速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md w-full fixed top-0 z-50">
        <div class="w-full container mx-auto flex flex-no-wrap items-center justify-between mt-0 py-2">
            <div class="pl-4">
                <a class="text-gray-800 text-base no-underline hover:no-underline font-extrabold text-xl" href="#">
                    <i class="fas fa-shopping-bag text-indigo-600 pr-2"></i>我的电商系统
                </a>
            </div>
            <div class="block lg:hidden pr-4">
                <button id="nav-toggle" class="flex items-center px-3 py-2 border rounded text-gray-500 border-gray-500 hover:text-gray-900 hover:border-teal-500 appearance-none focus:outline-none">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <!-- 右侧用户状态 -->
            <div class="hidden lg:block lg:w-auto pr-4" id="nav-content">
                <div class="text-sm">
                    <!-- 未登录状态 -->
                    <button onclick="toggleLoginModal()" class="text-indigo-600 hover:text-indigo-800 font-bold mr-4">登录 / 注册</button>
                    <!-- 已登录状态 (默认隐藏) -->
                    <span id="user-info" class="hidden">
                        欢迎, <span id="username-display" class="font-bold text-gray-700"></span>
                        <button onclick="logout()" class="text-red-500 hover:text-red-700 text-xs ml-2">退出</button>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 登录/注册模态框 (默认隐藏) -->
    <div id="login-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 relative">
            <button onclick="toggleLoginModal()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">用户登录</h2>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">邮箱</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="user@example.com" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">密码</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="******************" required>
                </div>
                <div class="flex items-center justify-between">
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="submit">
                        登录
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-4 text-center">注意：注册请直接调用 API 或使用此表单扩展</p>
            </form>
        </div>
    </div>

    <!-- 结算模态框 -->
    <div id="checkout-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-[500px] relative max-h-[80vh] overflow-y-auto">
            <button onclick="toggleCheckoutModal()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">确认订单</h2>
            <div id="checkout-items" class="mb-4">
                <!-- 购物车商品列表将通过 JS 动态插入 -->
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-bold">订单总价:</span>
                    <span id="checkout-total" class="text-xl font-bold text-indigo-600">¥0.00</span>
                </div>
                <button onclick="submitOrder()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline">
                    确认下单
                </button>
            </div>
        </div>
    </div>

    <!-- 订单列表模态框 -->
    <div id="orders-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-[700px] relative max-h-[80vh] overflow-y-auto">
            <button onclick="toggleOrdersModal()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">我的订单</h2>
            <div id="orders-list" class="space-y-4">
                <!-- 订单列表将通过 JS 动态插入 -->
            </div>
        </div>
    </div>

    <!-- 商品列表主体 -->
    <div class="container mx-auto pt-20 pb-10 px-4">
        <div class="flex flex-wrap -mx-2" id="product-list">
            
            <!-- 商品卡片将通过 JS 动态插入这里 -->
        </div>
    </div>

    <!-- 购物车悬浮球 -->
    <div class="fixed bottom-6 right-6 flex flex-col gap-2">
        <button onclick="toggleOrdersModal()" class="bg-gray-600 hover:bg-gray-700 text-white p-4 rounded-full shadow-lg transition flex items-center justify-center" title="我的订单">
            <i class="fas fa-receipt text-xl"></i>
        </button>
        <div onclick="openCheckout()" id="cart-button" class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-lg cursor-pointer transition flex items-center">
            <i class="fas fa-shopping-cart text-xl"></i>
            <span id="cart-count" class="bg-red-500 text-xs font-bold ml-2 px-2 py-0.5 rounded-full">0</span>
        </div>
    </div>

    <script>
        let cartCount = 0; // 购物车数量
        let currentUser = null; // 当前登录用户信息

        // 1. 页面加载时执行
        window.onload = function() {
            checkLoginStatus();
            fetchProducts();
        };

        // 2. 检查登录状态的函数
        function checkLoginStatus() {
            const savedToken = localStorage.getItem('access_token');
            const savedUser = localStorage.getItem('username');
            if (savedToken && savedUser) {
                currentUser = savedUser;
                document.getElementById('username-display').innerText = currentUser;
                document.getElementById('user-info').classList.remove('hidden');
                syncCartCount();
            }
        }

        // 同步购物车数量
        async function syncCartCount() {
            const token = localStorage.getItem('access_token');
            if (!token) return;
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/cart/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const resp = await response.json();
                    const carts = resp.data || [];
                    let totalItems = 0;
                    carts.forEach(cart => {
                        cart.items.forEach(item => {
                            totalItems += item.quantity;
                        });
                    });
                    cartCount = totalItems;
                    document.getElementById('cart-count').innerText = cartCount;
                    localStorage.setItem('cart_count', cartCount);
                }
            } catch (error) {
                console.error('同步购物车失败:', error);
            }
        }

        // 3. 核心：获取商品列表
        async function fetchProducts() {
            const container = document.getElementById('product-list');
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/products/');
                const responseData = await response.json();
                const products = responseData.data || [];
                container.innerHTML = '';
                
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = "w-full md:w-1/2 lg:w-1/3 p-4";
                    
                    // ⚠️ 修复点1: 修复了 class..= 的拼写错误，确保 DOM 结构正确
                    card.innerHTML = `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden h-full flex flex-col">
                            <img class="w-full h-48 object-cover" src="${product.image_url || 'https://via.placeholder.com/300'}" alt="${product.name}">
                            <!-- ⚠️ 修复点2: 修正了 div 的 class 属性拼写错误 -->
                            <div class="p-4 flex-1 flex flex-col">
                                <h3 class="text-lg font-bold text-gray-800">${product.name}</h3>
                                <p class="text-gray-600 text-sm mt-1">${product.description || ''}</p>
                                <p class="text-indigo-600 text-xl font-bold mt-2">¥${product.price}</p>
                                <!-- 传递 id 和 price 两个参数 -->
                                <button onclick="addToCart(${product.id}, ${product.price})" 
                                    class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition">
                                    加入购物车
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('获取商品失败:', error);
                container.innerHTML = '<p class="text-red-500 col-span-full text-center">加载商品失败，请检查后端是否启动！</p>';
            }
        }

        // 4. 登录模态框控制
        function toggleLoginModal() {
            document.getElementById('login-modal').classList.toggle('hidden');
        }

        // 5. 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('username', email);
                    currentUser = email;
                    document.getElementById('username-display').innerText = currentUser;
                    document.getElementById('user-info').classList.remove('hidden');
                    toggleLoginModal();
                    syncCartCount();
                    alert('登录成功！');
                } else {
                    const errorData = await response.json();
                    const errorMsg = errorData.message || errorData.detail || '登录失败';
                    alert('登录失败: ' + errorMsg);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('连接后端失败');
            }
        }

        // 6. 退出登录
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('username');
            currentUser = null;
            document.getElementById('user-info').classList.add('hidden');
        }

        // 7. 加入购物车 (增强诊断版)
        async function addToCart(productId, price) {

            if (!currentUser) {
                alert('请先登录！');
                toggleLoginModal();
                return;
            }

            const token = localStorage.getItem('access_token');
            
            // ⚠️ 修复点3: 强制转换为 Number，并打印日志
            const payload = {
                product_id: Number(productId),
                quantity: 1,
                price: Number(price)
            };

            // 🔍 诊断工具：打开 F12 控制台看这里！
            console.log("🎯 正在发送请求...");
            console.log("数据内容:", payload);
            console.log("数据类型:", {
                product_id: typeof payload.product_id,
                price: typeof payload.price
            });

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/cart/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                                    total_amount: price, // 总金额，后端需要这个字段
                                    items: [{
                                        product_id: Number(productId),
                                        quantity: 1,
                                        // price: productPrice
                                        }]
    })
                });

                if (response.ok) {
                    cartCount++;
                    document.getElementById('cart-count').innerText = cartCount;
                    localStorage.setItem('cart_count', cartCount);
                    alert('🎉 加入成功！');
                } else {
                    // ⚠️ 修复点4: 捕获并显示具体的后端错误信息
                    const errorData = await response.json();
                    console.error("❌ 后端返回的 422 错误详情:", errorData);
                    
                    // 弹窗显示具体错误，不再模糊
                    alert(`❌ 添加失败！请看控制台(F12)的Console页，错误: ${JSON.stringify(errorData)}`);
                }
            } catch (error) {
                console.error('❌ Network Error:', error);
                alert('❌ 请求失败，请检查控制台');
            }
        }

        let checkoutCartItems = [];

        function toggleCheckoutModal() {
            document.getElementById('checkout-modal').classList.toggle('hidden');
        }

        function toggleOrdersModal() {
            if (!currentUser) {
                alert('请先登录！');
                toggleLoginModal();
                return;
            }
            document.getElementById('orders-modal').classList.toggle('hidden');
            if (!document.getElementById('orders-modal').classList.contains('hidden')) {
                fetchOrders();
            }
        }

        async function openCheckout() {
            if (!currentUser) {
                alert('请先登录！');
                toggleLoginModal();
                return;
            }
            await loadCartForCheckout();
            toggleCheckoutModal();
        }

        async function loadCartForCheckout() {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/cart/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const resp = await response.json();
                    checkoutCartItems = resp.data || [];
                    renderCheckoutItems();
                }
            } catch (error) {
                console.error('获取购物车失败:', error);
            }
        }

        function renderCheckoutItems() {
            const container = document.getElementById('checkout-items');
            const totalSpan = document.getElementById('checkout-total');

            if (checkoutCartItems.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">购物车是空的</p>';
                totalSpan.textContent = '¥0.00';
                return;
            }

            let total = 0;
            let html = '';
            checkoutCartItems.forEach(cart => {
                cart.items.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    html += `
                        <div class="flex justify-between items-center py-2 border-b">
                            <div>
                                <span class="font-medium">${item.product_name || '商品'}</span>
                                <span class="text-gray-500 text-sm ml-2">x${item.quantity}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-indigo-600 font-bold">¥${itemTotal.toFixed(2)}</span>
                                <button onclick="removeCartItem(${item.id})" class="text-red-500 hover:text-red-700 text-sm">删除</button>
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;
            totalSpan.textContent = `¥${total.toFixed(2)}`;
        }

        async function removeCartItem(itemId) {
            if (!confirm('确认删除此商品？')) return;
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1/cart/items/${itemId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    await loadCartForCheckout();
                    syncCartCount();
                } else {
                    const data = await response.json();
                    alert('删除失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('删除失败，请检查网络');
            }
        }

        async function submitOrder() {
            if (checkoutCartItems.length === 0) {
                alert('购物车是空的！');
                return;
            }

            const token = localStorage.getItem('access_token');
            const orderItems = [];

            checkoutCartItems.forEach(cart => {
                cart.items.forEach(item => {
                    orderItems.push({
                        product_id: item.product_id,
                        quantity: item.quantity
                    });
                });
            });

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/order/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ items: orderItems })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('订单创建成功！');
                    toggleCheckoutModal();
                    cartCount = 0;
                    document.getElementById('cart-count').innerText = '0';
                    localStorage.removeItem('cart_count');
                    checkoutCartItems = [];
                } else {
                    alert('下单失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('下单失败:', error);
                alert('下单失败，请检查网络');
            }
        }

        async function fetchOrders() {
            const token = localStorage.getItem('access_token');
            const container = document.getElementById('orders-list');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/order/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    const orders = result.data || [];

                    if (orders.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 text-center">暂无订单</p>';
                        return;
                    }

                    let html = '';
                    orders.forEach(order => {
                        const date = new Date(order.created_at).toLocaleString('zh-CN');
                        const canPay = order.status === 'pending';
                        html += `
                            <div class="border rounded-lg p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-sm text-gray-500">订单号: ${order.order_number}</span>
                                    <span class="px-2 py-1 text-xs rounded ${
                                        order.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                        order.status === 'paid' ? 'bg-green-100 text-green-800' :
                                        'bg-gray-100 text-gray-800'
                                    }">${order.status === 'pending' ? '待结算' : order.status === 'paid' ? '已结算' : order.status}</span>
                                </div>
                                <div class="text-sm text-gray-600 mb-2">${date}</div>
                                <div class="border-t pt-2">
                                    ${order.items.map(item => `
                                        <div class="flex justify-between text-sm py-1">
                                            <span>${item.product_name} x${item.quantity}</span>
                                            <span>¥${item.price}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="border-t mt-2 pt-2 flex justify-between items-center">
                                    <span class="font-bold">总计:</span>
                                    <span class="text-indigo-600 font-bold text-lg">¥${order.total_amount.toFixed(2)}</span>
                                </div>
                                <div class="border-t mt-3 pt-3 flex gap-2 justify-end">
                                    ${canPay ? `<button onclick="payOrder(${order.id})" class="px-3 py-1 bg-green-500 text-white text-sm rounded hover:bg-green-600">结算</button>` : ''}
                                    <button onclick="deleteOrder(${order.id})" class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">删除</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p class="text-red-500 text-center">获取订单失败</p>';
                }
            } catch (error) {
                console.error('获取订单失败:', error);
                container.innerHTML = '<p class="text-red-500 text-center">获取订单失败</p>';
            }
        }

        async function payOrder(orderId) {
            if (!confirm('确认结算此订单？')) return;
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1/order/${orderId}/pay`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    alert('结算成功！');
                    fetchOrders();
                } else {
                    const data = await response.json();
                    alert('结算失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('结算失败，请检查网络');
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('确认删除此订单？')) return;
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1/order/${orderId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    alert('删除成功！');
                    fetchOrders();
                } else {
                    const data = await response.json();
                    alert('删除失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('删除失败，请检查网络');
            }
        }
    </script>
</body>
</html>
